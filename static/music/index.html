<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>找歌 · hooli.cc</title>
<style>
  :root {
    --bg: #0d0d0f;
    --card: #17171a;
    --card-hover: #1f1f23;
    --border: #2a2a30;
    --text: #e8e8ea;
    --muted: #8b8b93;
    --accent: #f59e0b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", sans-serif;
    padding: 24px 16px 64px;
  }
  .wrap { max-width: 620px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 {
    font-size: 20px; font-weight: 600; margin: 0 0 6px;
    letter-spacing: .02em;
  }
  .hint { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }

  .searchbar {
    display: flex; gap: 8px; margin: 20px 0 8px;
    position: sticky; top: 8px; z-index: 10;
  }
  input[type="search"] {
    flex: 1; min-width: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px;
    color: var(--text);
    font-size: 16px; /* 16px 防止 iOS 自动放大 */
    outline: none;
    transition: border-color .15s;
  }
  input[type="search"]:focus { border-color: var(--accent); }
  input[type="search"]::placeholder { color: #5c5c64; }

  .btn {
    background: var(--accent);
    color: #1a1200;
    border: none; border-radius: 10px;
    padding: 0 20px;
    font-size: 15px; font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: filter .15s;
  }
  .btn:active { filter: brightness(.88); }
  .btn:disabled { opacity: .5; cursor: default; }

  .status { font-size: 13px; color: var(--muted); min-height: 20px; margin: 8px 0 16px; }

  .song {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    transition: background .15s, border-color .15s;
  }
  .song.active { border-color: var(--accent); background: var(--card-hover); }
  .song__title {
    font-size: 15px; font-weight: 600; line-height: 1.4;
    margin-bottom: 4px;
    word-break: break-word;
  }
  .song__meta {
    font-size: 13px; color: var(--muted); line-height: 1.5;
    margin-bottom: 12px;
    word-break: break-word;
  }
  .song__actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .mini {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .mini:hover { border-color: #3d3d45; background: #202024; }
  .mini.primary { border-color: var(--accent); color: var(--accent); }
  .mini.done { border-color: #22c55e; color: #22c55e; }

  .player-slot { margin-top: 12px; }
  .player-slot iframe {
    width: 100%; border: 0; border-radius: 8px; display: block;
    background: #101012;
  }

  .tips {
    margin-top: 32px;
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.75;
    color: var(--muted);
  }
  .tips b { color: var(--text); font-weight: 600; }
  .tips code {
    background: #22222a; color: var(--accent);
    padding: 2px 6px; border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    word-break: break-all;
  }
  .tips ol { padding-left: 18px; margin: 8px 0 0; }
  .tips li { margin-bottom: 6px; }

  .fab-admin {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 99999;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 16px;
    border-radius: 999px;
    background: #f59e0b;
    color: #1a1200;
    font: 600 14px/1 inherit;
    text-decoration: none;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  .fab-admin:active { filter: brightness(.88); }
</style>
</head>
<body>
<a class="fab-admin" href="/admin/" target="_blank" rel="noopener">✏️ 进后台</a>
<div class="wrap">
  <header>
    <h1>找一首歌</h1>
    <p class="hint">搜到之后试听、复制，粘进后台的文章里就是一个播放器。</p>
  </header>

  <div class="searchbar">
    <input id="q" type="search" placeholder="歌名 / 歌手 / 专辑" autocomplete="off">
    <button class="btn" id="go">搜索</button>
  </div>
  <div class="status" id="status"></div>

  <div id="results"></div>

  <div class="tips">
    <b>怎么用</b>
    <ol>
      <li>在后台写文章，光标放到想插入的位置</li>
      <li>回这个页面点「复制代码」</li>
      <li>粘进正文。<b>粘贴完就不用管了</b>，发布后自动变成播放器</li>
    </ol>
    <p style="margin:12px 0 0">试试《漠河舞厅》这类中文歌，英文歌名有时候要加歌手名才搜得到。</p>
  </div>
</div>

<script>
(() => {
  // 这个地址在部署 OAuth Worker 后替换成真实地址
  const API = 'https://auth.hooli.cc/music/search';

  const $q = document.getElementById('q');
  const $go = document.getElementById('go');
  const $status = document.getElementById('status');
  const $results = document.getElementById('results');

  let currentQuery = '';
  let cacheKey = '';

  function fmtDuration(ms) {
    if (!ms) return '';
    const total = Math.round(ms / 1000);
    const m = Math.floor(total / 60);
    const s = String(total % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function shortcode(song) {
    return `{{< music id="${song.id}" name="${song.name}" artist="${song.artist}" >}}`;
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      // 手机上非 https 或权限被拒时的兜底
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch { ok = false; }
      document.body.removeChild(ta);
      return ok;
    }
  }

  function render(songs) {
    $results.innerHTML = '';
    if (!songs.length) {
      $status.textContent = currentQuery ? '没搜到，换个关键词试试' : '';
      return;
    }
    $status.textContent = `找到 ${songs.length} 首，点「去试听」打开网易云试听`;

    songs.forEach((song) => {
      const el = document.createElement('div');
      el.className = 'song';

      const title = document.createElement('div');
      title.className = 'song__title';
      title.textContent = song.name;

      const meta = document.createElement('div');
      meta.className = 'song__meta';
      const bits = [song.artist, song.album, fmtDuration(song.duration)].filter(Boolean);
      meta.textContent = bits.join(' · ');

      const actions = document.createElement('div');
      actions.className = 'song__actions';

      const playBtn = document.createElement('button');
      playBtn.className = 'mini primary';
      playBtn.textContent = '去试听 ▸';

      const copyBtn = document.createElement('button');
      copyBtn.className = 'mini';
      copyBtn.textContent = '复制代码';

      // 网易云对手机 UA 返回空的外链页面，iframe 内嵌在手机上不可靠，
      // 所以直接新窗口打开网易云歌曲页（手机上会拉起 App 或可播放的网页）
      playBtn.addEventListener('click', () => {
        window.open(`https://music.163.com/song?id=${song.id}`, '_blank', 'noopener');
      });

      copyBtn.addEventListener('click', async () => {
        const ok = await copyText(shortcode(song));
        const original = copyBtn.textContent;
        copyBtn.textContent = ok ? '已复制 ✓' : '复制失败';
        copyBtn.classList.toggle('done', ok);
        setTimeout(() => {
          copyBtn.textContent = original;
          copyBtn.classList.remove('done');
        }, 1600);
      });

      actions.append(playBtn, copyBtn);
      el.append(title, meta, actions);
      $results.appendChild(el);
    });
  }

  async function search() {
    const q = $q.value.trim();
    if (!q) return;
    if (q === cacheKey) return;
    cacheKey = q;
    currentQuery = q;
    $go.disabled = true;
    $status.textContent = '搜索中…';
    $results.innerHTML = '';

    try {
      const res = await fetch(`${API}?q=${encodeURIComponent(q)}&limit=8`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      render(data.songs || []);
    } catch (err) {
      $status.innerHTML =
        '搜索服务暂时连不上。可以这样手动加：<br>' +
        '① 在网易云 App 里分享歌曲 → 复制链接，链接里有 <code>song?id=数字</code><br>' +
        '② 把那个数字填进 <code>music id="数字"</code> 短代码里';
      console.error(err);
    } finally {
      $go.disabled = false;
    }
  }

  $go.addEventListener('click', search);
  $q.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); $q.blur(); search(); }
  });

  // 支持 ?q=歌名 直接搜
  const preset = new URLSearchParams(location.search).get('q');
  if (preset) {
    $q.value = preset;
    search();
  }
})();
</script>
</body>
</html>
